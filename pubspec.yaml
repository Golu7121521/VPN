name: roxyfy
description: ROXYFY - music streaming app (mock data, API-ready).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  startapp_sdk: ^3.0.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  just_audio: ">=0.9.40 <0.11.0"
  audio_service: ^0.18.15
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
