                Notification.Action stop = new Notification.Action.Builder(
                        android.R.drawable.ic_menu_save,
                        "Stop & Save",
                        action(ACTION_STOP, 11)).build();

                String text = summary;
                if (ph) {
                    long sec = accum / 1000;
                    text = String.format(Locale.US, "Paused at %02d:%02d | ", sec / 60, sec % 60) + summary;
                }

                Notification.Builder nb = newBuilder()
                        .setSmallIcon(R.drawable.ic_stat_rec)
                        .setColor(ph ? 0xFFFFAB00 : 0xFFFF1744)
                        .setSubText("Game Recorder")
                        .setContentTitle(ph ? "Paused" : "Recording")
                        .setContentText(text)
                        .setOngoing(true)
                        .setOnlyAlertOnce(true)
                        .addAction(toggle)
                        .addAction(stop);
                if (!ph) {
                    nb.setShowWhen(true).setUsesChronometer(true).setWhen(runStart - accum);
                } else {
                    nb.setShowWhen(false);
                }
                return nb.build();
            }

            private void updateNotification() {
                ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).notify(NOTIF_ID, buildNotification());
            }

            private void stopAndSave() {
                final Recorder r = rec;
                rec = null;
