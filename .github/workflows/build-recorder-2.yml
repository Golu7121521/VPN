        import java.nio.ByteOrder;
        import java.text.SimpleDateFormat;
        import java.util.Date;
        import java.util.Locale;

        public class Recorder {

            private static final int SR = 44100;
            private static final int CHUNK = 1024; // audio frames per read

            private final Context ctx;
            private final MediaProjection mp;
            private final Runnable onProjectionStopped;
            private int w, h;
            private final int dpi, bitrate, audioMode;
            private int fps;
            private float refresh = 60f;

            private MediaCodec vEnc, aEnc;
            private Surface surface;
            private VirtualDisplay vd;
            private MediaMuxer muxer;
            private AudioRecord apRec, micRec;
            private ParcelFileDescriptor pfd;
            private Uri uri;
            private File outFile;
            private Thread vThread, aThread;
            private MediaProjection.Callback cb;
            private boolean hasAudio = false;

            public boolean saved = false;

            private volatile boolean running = false;
            private boolean stopped = false;
            private volatile boolean paused = false;
            private volatile boolean needKey = false;
            private volatile long pausedTotalUs = 0;
            private long pauseStartUs = 0;
            private long startUs = 0;

            private final Object lock = new Object();
            private int vTrack = -1, aTrack = -1;
            private boolean muxStarted = false;
            private long lastV = -1, lastA = -1;

            public Recorder(Context ctx, MediaProjection mp, int shortSide, int fps, int bitrate,
                            int audioMode, int ori, Runnable onProjectionStopped) {
                this.ctx = ctx;
                this.mp = mp;
                this.fps = fps;
                this.bitrate = bitrate;
                this.audioMode = audioMode;
                this.onProjectionStopped = onProjectionStopped;

                DisplayMetrics dm = new DisplayMetrics();
                Display d = ((DisplayManager) ctx.getSystemService(Context.DISPLAY_SERVICE))
                        .getDisplay(Display.DEFAULT_DISPLAY);
                d.getRealMetrics(dm);
                try { refresh = d.getRefreshRate(); } catch (Exception ignored) { }
                int nativeShort = Math.min(dm.widthPixels, dm.heightPixels);
                int target = Math.min(shortSide, nativeShort);
                double ratio = (double) Math.max(dm.widthPixels, dm.heightPixels) / nativeShort;
                int s = align16(target);
                int l = align16((int) Math.round(target * ratio));
                boolean landscape = ori == 1 || (ori == 0 && dm.widthPixels > dm.heightPixels);
                this.w = landscape ? l : s;
                this.h = landscape ? s : l;
                this.dpi = dm.densityDpi;
            }

            static int align16(int v) {
                return Math.max(16, ((v + 8) / 16) * 16);
            }

            private static long nowUs() {
                return System.nanoTime() / 1000L;
            }

            public void start() throws Exception {
                openOutput();

                // ---- video encoder ----
                initVideoEncoder();

                // ---- audio (optional, never blocks video) ----
                setupAudio();

                cb = new MediaProjection.Callback() {
                    @Override
                    public void onStop() {
                        if (onProjectionStopped != null) onProjectionStopped.run();
                    }
                };
                mp.registerCallback(cb, new Handler(Looper.getMainLooper()));

                startUs = nowUs();
                running = true;
                startAudioRecords();
                vd = mp.createVirtualDisplay("GameRec", w, h, dpi,
                        DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, surface, null, null);

                vThread = new Thread(this::videoLoop, "rec-video");
                vThread.start();
                if (hasAudio) {
                    aThread = new Thread(this::audioLoop, "rec-audio");
                    aThread.start();
                }
            }

            private void openOutput() throws Exception {
                String name = "Rec_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".mp4";
                if (Build.VERSION.SDK_INT >= 29) {
                    ContentResolver cr = ctx.getContentResolver();
                    ContentValues v = new ContentValues();
                    v.put(MediaStore.Video.Media.DISPLAY_NAME, name);
                    v.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                    v.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/GameRec");
                    v.put(MediaStore.Video.Media.IS_PENDING, 1);
                    uri = cr.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
                    if (uri == null) throw new Exception("Could not create the video file");
                    pfd = cr.openFileDescriptor(uri, "rw");
                    if (pfd == null) throw new Exception("Could not open the video file");
                    muxer = new MediaMuxer(pfd.getFileDescriptor(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                } else {
                    File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "GameRec");
                    if (!dir.exists() && !dir.mkdirs()) throw new Exception("Could not create Movies/GameRec folder");
                    outFile = new File(dir, name);
                    muxer = new MediaMuxer(outFile.getAbsolutePath(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                }
            }

            private void initVideoEncoder() throws Exception {
                Exception last = null;
                for (int attempt = 0; attempt < 4; attempt++) {
                    for (int mode = 0; mode < 2; mode++) {
                        try {
                            vEnc = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC);
                            MediaCodecInfo.CodecCapabilities caps = null;
                            try {
                                caps = vEnc.getCodecInfo().getCapabilitiesForType(MediaFormat.MIMETYPE_VIDEO_AVC);
                                if (mode == 0) fitSize(caps.getVideoCapabilities());
                            } catch (Exception ignored) { }
                            vEnc.configure(videoFormat(caps, mode == 0), null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                            surface = vEnc.createInputSurface();
                            vEnc.start();
                            return;
                        } catch (Exception e) {
                            last = e;
                            try { if (vEnc != null) vEnc.release(); } catch (Exception ignored) { }
                            vEnc = null;
                            surface = null;
                        }
                    }
                    w = Math.max(16, ((int) (w * 0.75)) / 16 * 16);
                    h = Math.max(16, ((int) (h * 0.75)) / 16 * 16);
                }
                throw last != null ? last : new Exception("Video encoder error");
            }

            // Keeps the chosen resolution when the encoder supports it (lowering fps if needed),
            // otherwise scales the size down until the encoder accepts it.
            private void fitSize(MediaCodecInfo.VideoCapabilities vc) {
                for (int i = 0; i < 12; i++) {
                    try {
                        if (vc.isSizeSupported(w, h)) {
                            Range<Double> r = vc.getSupportedFrameRatesFor(w, h);
                            int maxFps = (int) Math.floor(r.getUpper());
                            if (maxFps >= 1 && fps > maxFps) fps = maxFps;
                            return;
                        }
                    } catch (Exception e) {
                        return;
                    }
                    w = Math.max(16, ((int) (w * 0.92)) / 16 * 16);
                    h = Math.max(16, ((int) (h * 0.92)) / 16 * 16);
                }
            }

            private MediaFormat videoFormat(MediaCodecInfo.CodecCapabilities caps, boolean full) {
                int br = bitrate;
                try {
                    if (caps != null) br = caps.getVideoCapabilities().getBitrateRange().clamp(bitrate);
                } catch (Exception ignored) { }
                MediaFormat vf = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, w, h);
                vf.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                vf.setInteger(MediaFormat.KEY_BIT_RATE, br);
                vf.setInteger(MediaFormat.KEY_FRAME_RATE, fps);
                vf.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1);
                if (full) {
                    vf.setLong(MediaFormat.KEY_REPEAT_PREVIOUS_FRAME_AFTER, 500000L);
                    vf.setInteger(MediaFormat.KEY_PRIORITY, 0);
                    vf.setInteger(MediaFormat.KEY_OPERATING_RATE, fps);
                    if (fps < 0.75f * refresh) {
                        vf.setInteger("max-fps-to-encoder", fps);
                    }
                    try {
                        if (caps != null) {
                            if (caps.getEncoderCapabilities()
                                    .isBitrateModeSupported(MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR)) {
                                vf.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR);
                            }
                            for (MediaCodecInfo.CodecProfileLevel pl : caps.profileLevels) {
                                if (pl.profile == MediaCodecInfo.CodecProfileLevel.AVCProfileHigh) {
                                    vf.setInteger(MediaFormat.KEY_PROFILE, MediaCodecInfo.CodecProfileLevel.AVCProfileHigh);
                                    break;
                                }
                            }
                        }
                    } catch (Exception ignored) { }
                }
                return vf;
            }

            private AudioRecord buildPlaybackRecord() {
                AudioPlaybackCaptureConfiguration cfg = new AudioPlaybackCaptureConfiguration.Builder(mp)
                        .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                        .addMatchingUsage(AudioAttributes.USAGE_GAME)
                        .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                        .build();
                AudioFormat fmt = new AudioFormat.Builder()
                        .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                        .setSampleRate(SR)
                        .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                        .build();
                int min = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT);
                return new AudioRecord.Builder()
                        .setAudioFormat(fmt)
                        .setBufferSizeInBytes(Math.max(min, CHUNK * 8))
                        .setAudioPlaybackCaptureConfig(cfg)
                        .build();
            }

            private void setupAudio() {
                boolean wantDevice = (audioMode == 1 || audioMode == 2) && Build.VERSION.SDK_INT >= 29;
                boolean wantMic = audioMode == 2 || audioMode == 3;
                if (wantDevice) {
                    try {
                        apRec = buildPlaybackRecord();
                        if (apRec.getState() != AudioRecord.STATE_INITIALIZED) {
                            apRec.release();
                            apRec = null;
                        }
                    } catch (Throwable t) {
                        apRec = null;
                    }
                }
                if (wantMic) {
                    try {
                        int min = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                        micRec = new AudioRecord(MediaRecorder.AudioSource.MIC, SR,
                                AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT,
                                Math.max(min, CHUNK * 4));
                        if (micRec.getState() != AudioRecord.STATE_INITIALIZED) {
                            micRec.release();
                            micRec = null;
                        }
                    } catch (Throwable t) {
                        micRec = null;
                    }
                }
                if (apRec == null && micRec == null) return;
                try {
                    MediaFormat af = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, SR, 2);
                    af.setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC);
                    af.setInteger(MediaFormat.KEY_BIT_RATE, 128000);
                    af.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384);
                    aEnc = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC);
                    aEnc.configure(af, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                    aEnc.start();
                    hasAudio = true;
                } catch (Throwable t) {
                    releaseAudioRecords();
                    if (aEnc != null) {
                        try { aEnc.release(); } catch (Throwable ignored) { }
                        aEnc = null;
                    }
                    hasAudio = false;
                }
            }

            private void releaseAudioRecords() {
                try { if (apRec != null) apRec.release(); } catch (Throwable ignored) { }
                try { if (micRec != null) micRec.release(); } catch (Throwable ignored) { }
                apRec = null;
                micRec = null;
            }

            private void startAudioRecords() {
                if (!hasAudio) return;
                if (apRec != null) {
                    try {
                        apRec.startRecording();
                        if (apRec.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) {
                            throw new IllegalStateException();
                        }
                    } catch (Throwable t) {
                        try { apRec.release(); } catch (Throwable ignored) { }
                        apRec = null;
                    }
                }
                if (micRec != null) {
                    try {
                        micRec.startRecording();
                        if (micRec.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) {
                            throw new IllegalStateException();
                        }
                    } catch (Throwable t) {
                        try { micRec.release(); } catch (Throwable ignored) { }
                        micRec = null;
                    }
                }
                if (apRec == null && micRec == null) {
                    hasAudio = false;
                    if (aEnc != null) {
                        try { aEnc.release(); } catch (Throwable ignored) { }
                        aEnc = null;
                    }
                }
            }

            public synchronized void pause() {
                if (!running || paused) return;
                pauseStartUs = nowUs();
                paused = true;
            }

            public synchronized void resume() {
                if (!running || !paused) return;
                pausedTotalUs += nowUs() - pauseStartUs;
                needKey = true;
                try {
                    Bundle b = new Bundle();
                    b.putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0);
                    vEnc.setParameters(b);
                } catch (Exception ignored) { }
                paused = false;
            }

            private void addTrack(MediaFormat f, boolean video) {
                synchronized (lock) {
                    try {
                        int t = muxer.addTrack(f);
                        if (video) vTrack = t; else aTrack = t;
                        if (vTrack >= 0 && (!hasAudio || aTrack >= 0) && !muxStarted) {
                            muxer.start();
                            muxStarted = true;
                            lock.notifyAll();
                        }
                    } catch (Exception ignored) { }
                    long deadline = System.currentTimeMillis() + 5000;
                    while (!muxStarted && System.currentTimeMillis() < deadline) {
                        try { lock.wait(200); } catch (InterruptedException e) { break; }
                    }
                }
            }

            private void write(int track, ByteBuffer buf, MediaCodec.BufferInfo info, long pts, boolean video) {
                if (pts < 0) pts = 0;
                synchronized (lock) {
                    if (!muxStarted) return;
                    long last = video ? lastV : lastA;
                    if (pts <= last) pts = last + 1;
                    if (video) lastV = pts; else lastA = pts;
                    info.presentationTimeUs = pts;
                    buf.position(info.offset);
                    buf.limit(info.offset + info.size);
                    try {
                        muxer.writeSampleData(track, buf, info);
                    } catch (Exception ignored) { }
                }
            }

            private void videoLoop() {
                Process.setThreadPriority(Process.THREAD_PRIORITY_DISPLAY);
                MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                boolean eosSent = false;
                long vBase = Long.MIN_VALUE;
                try {
                    while (true) {
                        if (!running && !eosSent) {
                            try { vEnc.signalEndOfInputStream(); } catch (Exception ignored) { }
                            eosSent = true;
                        }
                        int idx = vEnc.dequeueOutputBuffer(info, 10000);
                        if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                            addTrack(vEnc.getOutputFormat(), true);
                        } else if (idx >= 0) {
                            ByteBuffer buf = vEnc.getOutputBuffer(idx);
                            boolean eos = (info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0;
                            boolean config = (info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0;
                            if (!config && info.size > 0 && !paused && buf != null) {
                                boolean key = (info.flags & MediaCodec.BUFFER_FLAG_KEY_FRAME) != 0;
                                if (needKey && key) needKey = false;
                                if (!needKey) {
                                    if (vBase == Long.MIN_VALUE) {
                                        vBase = info.presentationTimeUs - (nowUs() - startUs);
                                    }
                                    long pts = info.presentationTimeUs - vBase - pausedTotalUs;
                                    write(vTrack, buf, info, pts, true);
                                }
                            }
                            vEnc.releaseOutputBuffer(idx, false);
                            if (eos) break;
                        }
                    }
                } catch (Exception ignored) { }
            }

            private void audioLoop() {
                Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO);
                short[] st = new short[CHUNK * 2];
                short[] mono = new short[CHUNK];
                byte[] bytes = new byte[CHUNK * 4];
                MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                long frames = 0;
                long base = Long.MIN_VALUE;
                long lastPts = 0;
                try {
                    while (running) {
                        int fr;
                        if (apRec != null) {
                            int n = apRec.read(st, 0, st.length);
                            if (n <= 0) {
                                Thread.sleep(5);
                                continue;
                            }
                            fr = n / 2;
                            if (micRec != null) {
                                int m = micRec.read(mono, 0, CHUNK);
                                int cnt = Math.min(Math.max(m, 0), fr);
                                for (int i = 0; i < cnt; i++) {
                                    st[2 * i] = clip(st[2 * i] + mono[i]);
                                    st[2 * i + 1] = clip(st[2 * i + 1] + mono[i]);
                                }
                            }
                        } else {
                            int m = micRec.read(mono, 0, CHUNK);
                            if (m <= 0) {
                                Thread.sleep(5);
                                continue;
                            }
                            fr = m;
                            for (int i = 0; i < fr; i++) {
                                st[2 * i] = mono[i];
                                st[2 * i + 1] = mono[i];
                            }
                        }
                        if (paused) continue;
                        if (base == Long.MIN_VALUE) {
                            base = (nowUs() - startUs - pausedTotalUs) - fr * 1000000L / SR;
                        }
                        long pts = base + frames * 1000000L / SR;
                        lastPts = pts;
                        frames += fr;

                        ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN).asShortBuffer().put(st, 0, fr * 2);
                        int in = aEnc.dequeueInputBuffer(10000);
                        if (in >= 0) {
                            ByteBuffer ib = aEnc.getInputBuffer(in);
                            ib.clear();
                            ib.put(bytes, 0, fr * 4);
                            aEnc.queueInputBuffer(in, 0, fr * 4, pts, 0);
                        }
                        drainAudio(info, 0);
                    }

                    for (int tries = 0; tries < 50; tries++) {
                        int in = aEnc.dequeueInputBuffer(10000);
                        if (in >= 0) {
                            aEnc.queueInputBuffer(in, 0, 0, lastPts + 1000, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                            break;
                        }
                        drainAudio(info, 0);
                    }
                    long deadline = System.currentTimeMillis() + 3000;
                    while (System.currentTimeMillis() < deadline) {
                        if (drainAudio(info, 10000)) break;
                    }
                } catch (Exception ignored) { }
            }

            private static short clip(int v) {
                if (v > Short.MAX_VALUE) return Short.MAX_VALUE;
                if (v < Short.MIN_VALUE) return Short.MIN_VALUE;
                return (short) v;
            }

            private boolean drainAudio(MediaCodec.BufferInfo info, long timeoutUs) {
                while (true) {
                    int idx = aEnc.dequeueOutputBuffer(info, timeoutUs);
                    if (idx == MediaCodec.INFO_TRY_AGAIN_LATER) return false;
                    if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                        addTrack(aEnc.getOutputFormat(), false);
                        continue;
                    }
                    if (idx < 0) continue;
                    ByteBuffer buf = aEnc.getOutputBuffer(idx);
                    boolean eos = (info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0;
                    boolean config = (info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0;
                    if (!config && info.size > 0 && buf != null) {
                        write(aTrack, buf, info, info.presentationTimeUs, false);
                    }
                    aEnc.releaseOutputBuffer(idx, false);
                    if (eos) return true;
                }
            }

            public Uri stop() {
                if (stopped) return uri;
                stopped = true;
                running = false;
                try { if (cb != null) mp.unregisterCallback(cb); } catch (Exception ignored) { }
                try { if (vd != null) vd.release(); } catch (Exception ignored) { }
                try { if (vThread != null) vThread.join(5000); } catch (Exception ignored) { }
                try { if (aThread != null) aThread.join(8000); } catch (Exception ignored) { }
                try { if (apRec != null) { apRec.stop(); apRec.release(); } } catch (Exception ignored) { }
                try { if (micRec != null) { micRec.stop(); micRec.release(); } } catch (Exception ignored) { }
                try { if (vEnc != null) { vEnc.stop(); vEnc.release(); } } catch (Exception ignored) { }
                try { if (aEnc != null) { aEnc.stop(); aEnc.release(); } } catch (Exception ignored) { }
                try { if (surface != null) surface.release(); } catch (Exception ignored) { }
                boolean ok = muxStarted;
                try { if (muxer != null && muxStarted) muxer.stop(); } catch (Exception e) { ok = false; }
                try { if (muxer != null) muxer.release(); } catch (Exception ignored) { }
                try { mp.stop(); } catch (Exception ignored) { }
                try { if (pfd != null) pfd.close(); } catch (Exception ignored) { }

                try {
                    if (uri != null) {
                        ContentResolver cr = ctx.getContentResolver();
                        if (ok) {
                            ContentValues v = new ContentValues();
                            v.put(MediaStore.Video.Media.IS_PENDING, 0);
                            cr.update(uri, v, null, null);
                        } else {
                            cr.delete(uri, null, null);
                            uri = null;
                        }
                    } else if (outFile != null) {
                        if (ok) {
                            MediaScannerConnection.scanFile(ctx, new String[]{outFile.getAbsolutePath()},
                                    new String[]{"video/mp4"}, null);
                        } else {
                            outFile.delete();
                        }
                    }
                } catch (Exception ignored) { }
                saved = ok;
                return uri;
            }
        }
        EOF

    - name: Build release APK and AAB
      run: gradle assembleRelease bundleRelease --stacktrace

    - name: Upload APK and AAB
      uses: actions/upload-artifact@v4
      with:
        name: GameRecorder
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
