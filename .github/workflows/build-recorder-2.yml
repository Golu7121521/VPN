name: Build Game Recorder (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'

    - name: Prepare release key (only if secrets are set)
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        fi

    - name: Generate project files
      run: |
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GameRecorder"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.11.1' apply false
        }
        EOF

        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        def ksFile = System.getenv("KEYSTORE_FILE")

        android {
            namespace 'com.gamerec.lite'
            compileSdk 36

            defaultConfig {
                applicationId "com.gamerec.lite"
                minSdk 21
                targetSdk 36
                versionCode 6
                versionName "2.0"
            }

            signingConfigs {
                release {
                    if (ksFile) {
                        storeFile file(ksFile)
                        storePassword System.getenv("KEYSTORE_PASSWORD")
                        keyAlias System.getenv("KEY_ALIAS")
                        keyPassword System.getenv("KEY_PASSWORD")
                    }
                }
            }

            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
                }
            }

            dependenciesInfo {
                includeInApk false
                includeInBundle false
            }

            packaging {
                resources {
                    excludes += ['/META-INF/**', '/kotlin/**', 'DebugProbesKt.bin']
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }
        EOF

        mkdir -p app
        cat << 'EOF' > app/proguard-rules.pro
        -allowaccessmodification
        -repackageclasses ''
        -overloadaggressively
        EOF

        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/ic_colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="ic_bg">#0B0E14</color>
        </resources>
        EOF

        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_fg.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#00000000"
                android:pathData="M28,54a26,26 0 1,0 52,0a26,26 0 1,0 -52,0z"
                android:strokeColor="#00E5FF"
                android:strokeWidth="5" />
            <path
                android:fillColor="#FF1744"
                android:pathData="M40,54a14,14 0 1,0 28,0a14,14 0 1,0 -28,0z" />
        </vector>
        EOF

        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_mono.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#00000000"
                android:pathData="M28,54a26,26 0 1,0 52,0a26,26 0 1,0 -52,0z"
                android:strokeColor="#000000"
                android:strokeWidth="5" />
            <path
                android:fillColor="#000000"
                android:pathData="M40,54a14,14 0 1,0 28,0a14,14 0 1,0 -28,0z" />
        </vector>
        EOF

        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_stat_rec.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp"
            android:height="24dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path
                android:fillColor="#00000000"
                android:pathData="M3,12a9,9 0 1,0 18,0a9,9 0 1,0 -18,0z"
                android:strokeColor="#FFFFFF"
                android:strokeWidth="2" />
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M8,12a4,4 0 1,0 8,0a4,4 0 1,0 -8,0z" />
        </vector>
        EOF

        mkdir -p app/src/main/res/mipmap-anydpi-v26
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_bg" />
            <foreground android:drawable="@drawable/ic_fg" />
            <monochrome android:drawable="@drawable/ic_mono" />
        </adaptive-icon>
        EOF

        mkdir -p app/src/main/res/mipmap-anydpi
        cat << 'EOF' > app/src/main/res/mipmap-anydpi/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#0B0E14"
                android:pathData="M24,0H84A24,24 0 0 1 108,24V84A24,24 0 0 1 84,108H24A24,24 0 0 1 0,84V24A24,24 0 0 1 24,0Z" />
            <path
                android:fillColor="#00000000"
                android:pathData="M24,54a30,30 0 1,0 60,0a30,30 0 1,0 -60,0z"
                android:strokeColor="#00E5FF"
                android:strokeWidth="6" />
            <path
                android:fillColor="#FF1744"
                android:pathData="M38,54a16,16 0 1,0 32,0a16,16 0 1,0 -32,0z" />
        </vector>
        EOF

        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission
                android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                android:maxSdkVersion="28" />

            <uses-feature
                android:name="android.hardware.microphone"
                android:required="false" />
            <uses-feature
                android:name="android.hardware.touchscreen"
                android:required="false" />

            <application
                android:allowBackup="false"
                android:icon="@mipmap/ic_launcher"
                android:label="Game Recorder"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".RecorderService"
                    android:exported="false"
                    android:foregroundServiceType="mediaProjection|microphone" />
            </application>
        </manifest>
        EOF

        mkdir -p app/src/main/java/com/gamerec/lite
        cat << 'EOF' > app/src/main/java/com/gamerec/lite/MainActivity.java
        package com.gamerec.lite;

        import android.Manifest;
        import android.app.Activity;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.content.pm.PackageManager;
        import android.graphics.Color;
        import android.graphics.Insets;
        import android.graphics.Typeface;
        import android.graphics.drawable.GradientDrawable;
        import android.media.projection.MediaProjectionManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.Gravity;
        import android.view.View;
        import android.view.ViewGroup;
        import android.view.Window;
        import android.view.WindowInsets;
        import android.view.WindowInsetsController;
        import android.view.WindowManager;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.ScrollView;
        import android.widget.TextView;
        import android.widget.Toast;

        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends Activity {

            private static final int REQ_PERM = 1;
            private static final int REQ_CAPTURE = 2;

            private static final int C_BG1 = 0xFF0B0E14;
            private static final int C_BG2 = 0xFF121A2B;
            private static final int C_CARD = 0xFF161B26;
            private static final int C_LINE = 0xFF222C3D;
            private static final int C_FIELD = 0xFF0F131C;
            private static final int C_CYAN = 0xFF00E5FF;
            private static final int C_MUTED = 0xFF7A889B;

            private final String[] resLabels = {"480p", "720p", "1080p"};
            private final int[] resValues = {480, 720, 1080};
            private final String[] fpsLabels = {"24", "30", "60"};
            private final int[] fpsValues = {24, 30, 60};
            private final String[] bitLabels = {"2", "4", "8", "12", "16"};
            private final int[] bitValues = {2, 4, 8, 12, 16};
            private final String[] audioLabels = {"Device audio", "Device + Mic"};
            private final String[] oriLabels = {"Auto", "Landscape", "Portrait"};

            private Seg segRes, segFps, segBit, segAudio, segOri;
            private SharedPreferences prefs;
            private float density;
            private boolean audioDenied = false;

            private int dp(int v) {
                return (int) (v * density + 0.5f);
            }

            private GradientDrawable rounded(int fill, int radiusDp, int stroke) {
                GradientDrawable g = new GradientDrawable();
                g.setColor(fill);
                g.setCornerRadius(dp(radiusDp));
                if (stroke != 0) g.setStroke(dp(1), stroke);
                return g;
            }

            private boolean has(String perm) {
                return Build.VERSION.SDK_INT < 23 || checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
            }

            // 1 = device audio, 2 = device + mic, 3 = mic only (Android 9 and below)
            private int audioMode() {
                if (Build.VERSION.SDK_INT >= 29) {
                    return segAudio.sel == 1 ? 2 : 1;
                }
                return 3;
            }

            private class Seg {
                int sel;
                final TextView[] tabs;

                Seg(LinearLayout parent, String label, String[] items, int initial) {
                    TextView lb = new TextView(MainActivity.this);
                    lb.setText(label);
                    lb.setTextColor(C_MUTED);
                    lb.setTextSize(11);
                    lb.setLetterSpacing(0.1f);
                    lb.setPadding(dp(2), dp(16), 0, dp(6));
                    parent.addView(lb);

                    LinearLayout row = new LinearLayout(MainActivity.this);
                    row.setOrientation(LinearLayout.HORIZONTAL);
                    row.setPadding(dp(4), dp(4), dp(4), dp(4));
                    row.setBackground(rounded(C_FIELD, 14, C_LINE));
                    tabs = new TextView[items.length];
                    sel = Math.max(0, Math.min(initial, items.length - 1));
                    for (int i = 0; i < items.length; i++) {
                        final int idx = i;
                        TextView t = new TextView(MainActivity.this);
                        t.setText(items[i]);
                        t.setGravity(Gravity.CENTER);
                        t.setTextSize(14);
                        t.setPadding(dp(4), dp(12), dp(4), dp(12));
                        t.setOnClickListener(v -> {
                            sel = idx;
                            refresh();
                        });
                        tabs[i] = t;
                        row.addView(t, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                    }
                    parent.addView(row, new LinearLayout.LayoutParams(
                            ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                    refresh();
                }

                void refresh() {
                    for (int i = 0; i < tabs.length; i++) {
                        if (i == sel) {
                            tabs[i].setBackground(rounded(C_CYAN, 10, 0));
                            tabs[i].setTextColor(C_BG1);
                            tabs[i].setTypeface(Typeface.DEFAULT_BOLD);
                        } else {
                            tabs[i].setBackground(null);
                            tabs[i].setTextColor(C_MUTED);
                            tabs[i].setTypeface(Typeface.DEFAULT);
                        }
                    }
                }
            }

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                prefs = getSharedPreferences("settings", MODE_PRIVATE);
                density = getResources().getDisplayMetrics().density;

                Window win = getWindow();
                win.setStatusBarColor(Color.TRANSPARENT);
                win.setNavigationBarColor(Color.TRANSPARENT);
                if (Build.VERSION.SDK_INT >= 28) {
                    WindowManager.LayoutParams wlp = win.getAttributes();
                    wlp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                    win.setAttributes(wlp);
                }
                if (Build.VERSION.SDK_INT >= 30) {
                    win.setDecorFitsSystemWindows(false);
                }

                LinearLayout root = new LinearLayout(this);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setPadding(dp(20), dp(28), dp(20), dp(28));

                TextView title = new TextView(this);
                title.setText("GAME RECORDER");
                title.setTextColor(C_CYAN);
                title.setTextSize(26);
                title.setTypeface(Typeface.DEFAULT_BOLD);
                title.setLetterSpacing(0.14f);
                title.setPadding(0, 0, 0, dp(22));
                root.addView(title);

                LinearLayout card = new LinearLayout(this);
                card.setOrientation(LinearLayout.VERTICAL);
                card.setPadding(dp(16), dp(16), dp(16), dp(18));
                card.setBackground(rounded(C_CARD, 18, C_LINE));
                root.addView(card);

                TextView head = new TextView(this);
                head.setText("RECORDING SETTINGS");
                head.setTextColor(C_CYAN);
                head.setTextSize(11);
                head.setTypeface(Typeface.DEFAULT_BOLD);
                head.setLetterSpacing(0.12f);
                card.addView(head);

                segRes = new Seg(card, "RESOLUTION", resLabels, prefs.getInt("res", 1));
                segFps = new Seg(card, "FPS", fpsLabels, prefs.getInt("fps", 1));
                segBit = new Seg(card, "BITRATE (MBPS)", bitLabels, prefs.getInt("bit", 2));
                if (Build.VERSION.SDK_INT >= 29) {
                    segAudio = new Seg(card, "AUDIO", audioLabels, prefs.getInt("audio", 0));
                }
                segOri = new Seg(card, "ORIENTATION", oriLabels, prefs.getInt("ori", 0));

                Button start = new Button(this);
                start.setText("START RECORDING");
                start.setAllCaps(false);
                start.setTextColor(Color.WHITE);
                start.setTextSize(16);
                start.setTypeface(Typeface.DEFAULT_BOLD);
                start.setLetterSpacing(0.08f);
                start.setStateListAnimator(null);
                GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                        new int[]{0xFFFF1744, 0xFFFF6D00});
                bg.setCornerRadius(dp(30));
                start.setBackground(bg);
                LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, dp(60));
                lp.topMargin = dp(26);
                root.addView(start, lp);
                start.setOnClickListener(v -> onStartClicked());

                final ScrollView sv = new ScrollView(this);
                sv.setFillViewport(true);
                sv.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                        new int[]{C_BG1, C_BG2}));
                sv.addView(root);
                sv.setOnApplyWindowInsetsListener((v, ins) -> {
                    int l, t, r, b;
                    if (Build.VERSION.SDK_INT >= 30) {
                        Insets in = ins.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                        l = in.left;
                        t = in.top;
                        r = in.right;
                        b = in.bottom;
                    } else {
                        l = ins.getSystemWindowInsetLeft();
                        t = ins.getSystemWindowInsetTop();
                        r = ins.getSystemWindowInsetRight();
                        b = ins.getSystemWindowInsetBottom();
                        if (Build.VERSION.SDK_INT >= 28 && ins.getDisplayCutout() != null) {
                            t = Math.max(t, ins.getDisplayCutout().getSafeInsetTop());
                        }
                    }
                    v.setPadding(l, t, r, b);
                    return ins;
                });
                setContentView(sv);
                applyBars();
            }

            private void applyBars() {
                Window w = getWindow();
                if (Build.VERSION.SDK_INT >= 30) {
                    WindowInsetsController c = w.getInsetsController();
                    if (c != null) {
                        c.hide(WindowInsets.Type.statusBars());
                        c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                    }
                } else {
                    w.getDecorView().setSystemUiVisibility(
                            View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                    | View.SYSTEM_UI_FLAG_FULLSCREEN);
                }
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
                super.onWindowFocusChanged(hasFocus);
                if (hasFocus) applyBars();
            }

            private void saveSettings() {
                SharedPreferences.Editor e = prefs.edit()
                        .putInt("res", segRes.sel)
                        .putInt("fps", segFps.sel)
                        .putInt("bit", segBit.sel)
                        .putInt("ori", segOri.sel);
                if (segAudio != null) e.putInt("audio", segAudio.sel);
                e.apply();
            }

            @Override
            protected void onPause() {
                saveSettings();
                super.onPause();
            }

            private void onStartClicked() {
                saveSettings();
                audioDenied = false;
                List<String> need = new ArrayList<>();
                if (!has(Manifest.permission.RECORD_AUDIO)) {
                    need.add(Manifest.permission.RECORD_AUDIO);
                }
                if (Build.VERSION.SDK_INT >= 33 && !has("android.permission.POST_NOTIFICATIONS")) {
                    need.add("android.permission.POST_NOTIFICATIONS");
                }
                if (Build.VERSION.SDK_INT < 29 && !has(Manifest.permission.WRITE_EXTERNAL_STORAGE)) {
                    need.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                }
                if (need.isEmpty()) {
                    startCapture();
                } else {
                    requestPermissions(need.toArray(new String[0]), REQ_PERM);
                }
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode != REQ_PERM) return;
                if (Build.VERSION.SDK_INT < 29 && !has(Manifest.permission.WRITE_EXTERNAL_STORAGE)) {
                    Toast.makeText(this, "Storage permission is required to save videos", Toast.LENGTH_LONG).show();
                    return;
                }
                if (!has(Manifest.permission.RECORD_AUDIO)) {
                    audioDenied = true;
                    Toast.makeText(this, "Audio permission denied. Recording without audio.", Toast.LENGTH_LONG).show();
                }
                startCapture();
            }

            private void startCapture() {
                try {
                    MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                    startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE);
                } catch (Exception e) {
                    Toast.makeText(this, "Screen capture is not available on this device", Toast.LENGTH_LONG).show();
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode != REQ_CAPTURE) return;
                if (resultCode == RESULT_OK && data != null) {
                    Intent i = new Intent(this, RecorderService.class);
                    i.setAction(RecorderService.ACTION_START);
                    i.putExtra("code", resultCode);
                    i.putExtra("data", data);
                    i.putExtra("res", resValues[segRes.sel]);
                    i.putExtra("fps", fpsValues[segFps.sel]);
                    i.putExtra("mbps", bitValues[segBit.sel]);
                    i.putExtra("audio", audioDenied ? 0 : audioMode());
                    i.putExtra("ori", segOri.sel);
                    if (Build.VERSION.SDK_INT >= 26) {
                        startForegroundService(i);
                    } else {
                        startService(i);
                    }
                    moveTaskToBack(true);
                } else {
                    Toast.makeText(this, "Screen capture permission denied", Toast.LENGTH_SHORT).show();
                }
            }
        }
        EOF

        mkdir -p app/src/main/java/com/gamerec/lite
        cat << 'EOF' > app/src/main/java/com/gamerec/lite/RecorderService.java
        package com.gamerec.lite;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.PendingIntent;
        import android.app.Service;
        import android.content.Intent;
        import android.content.pm.ServiceInfo;
        import android.media.projection.MediaProjection;
        import android.media.projection.MediaProjectionManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.IBinder;
        import android.widget.Toast;

        import java.util.Locale;

        public class RecorderService extends Service {

            public static final String ACTION_START = "com.gamerec.lite.START";
            public static final String ACTION_PAUSE = "com.gamerec.lite.PAUSE";
            public static final String ACTION_RESUME = "com.gamerec.lite.RESUME";
            public static final String ACTION_STOP = "com.gamerec.lite.STOP";

            private static final String CHANNEL_ID = "rec_channel";
            private static final int NOTIF_ID = 1;
            private static final int SAVED_ID = 2;

            private Recorder rec;
            private boolean paused = false;
            private long runStart = 0, accum = 0;
            private String summary = "";

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                String action = intent == null ? null : intent.getAction();
                if (action == null) {
                    stopSelf();
                    return START_NOT_STICKY;
                }
                switch (action) {
                    case ACTION_START:
                        if (rec == null) startRecording(intent);
                        break;
                    case ACTION_PAUSE:
                        if (rec != null && !paused) {
                            rec.pause();
                            accum += System.currentTimeMillis() - runStart;
                            paused = true;
                            updateNotification();
                        }
                        break;
                    case ACTION_RESUME:
                        if (rec != null && paused) {
                            rec.resume();
                            runStart = System.currentTimeMillis();
                            paused = false;
                            updateNotification();
                        }
                        break;
                    case ACTION_STOP:
                        stopAndSave();
                        break;
                    default:
                        break;
                }
                return START_NOT_STICKY;
            }

            private void startRecording(Intent intent) {
                NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= 26) {
                    nm.createNotificationChannel(new NotificationChannel(
                            CHANNEL_ID, "Recording", NotificationManager.IMPORTANCE_LOW));
                }

                int audio = intent.getIntExtra("audio", 0);
                boolean mic = audio == 2 || audio == 3;
