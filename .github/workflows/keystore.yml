name: Create keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore roxy.jks -alias roxy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Roxyfy, O=Roxyfy, C=IN"
          {
            echo "Create these 4 repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "KEY_ALIAS = roxy"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_PASSWORD = $PASS"
            echo
            echo "ANDROID_KEYSTORE_BASE64 ="
            base64 -w0 roxy.jks
            echo
          } > roxyfy-keystore-SECRET.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roxyfy-keystore-SECRET
          path: roxyfy-keystore-SECRET.txt
