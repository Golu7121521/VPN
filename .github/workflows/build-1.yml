name: Build Music App (NewPipe)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npe_version:
        description: "NewPipeExtractor version (JitPack tag)"
        default: "v0.26.4"

env:
  NPE_VERSION: ${{ github.event.inputs.npe_version || 'v0.26.4' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Android project
        run: |
          mkdir -p ytapp/app/src/main/java/com/example/musicapp
          cd ytapp

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = 'MusicApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.9.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.example.musicapp'
            compileSdk 35
            defaultConfig {
              applicationId 'com.example.musicapp'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
              coreLibraryDesugaringEnabled true
            }
            kotlinOptions { jvmTarget = '17' }
            packaging {
              resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
            }
          }
          dependencies {
            implementation 'com.github.TeamNewPipe:NewPipeExtractor:__NPE__'
            coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'androidx.media3:media3-exoplayer:1.3.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.core:core-ktx:1.13.1'
          }
          EOF
          sed -i "s/__NPE__/$NPE_VERSION/" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Music Test"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/musicapp/MainActivity.kt <<'EOF'
          package com.example.musicapp

          import android.os.Bundle
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import okhttp3.OkHttpClient
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.ServiceList
          import org.schabi.newpipe.extractor.downloader.Downloader
          import org.schabi.newpipe.extractor.downloader.Request
          import org.schabi.newpipe.extractor.downloader.Response
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException
          import org.schabi.newpipe.extractor.stream.DeliveryMethod
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import org.schabi.newpipe.extractor.stream.StreamInfoItem
          import java.util.concurrent.TimeUnit

          const val UA = "Mozilla/5.0 (Windows NT 10.0; rv:128.0) Gecko/20100101 Firefox/128.0"

          class DL : Downloader() {
              private val client = OkHttpClient.Builder().readTimeout(30, TimeUnit.SECONDS).build()
              override fun execute(request: Request): Response {
                  val m = request.httpMethod()
                  var body = request.dataToSend()?.toRequestBody()
                  if (body == null && (m == "POST" || m == "PUT")) body = ByteArray(0).toRequestBody()
                  val b = okhttp3.Request.Builder().url(request.url()).method(m, body).header("User-Agent", UA)
                  request.headers().forEach { (k, v) ->
                      b.removeHeader(k)
                      v.forEach { b.addHeader(k, it) }
                  }
                  val r = client.newCall(b.build()).execute()
                  if (r.code == 429) { r.close(); throw ReCaptchaException("Rate limited", request.url()) }
                  val text = r.body?.string()
                  return Response(r.code, r.message, r.headers.toMultimap(), text, r.request.url.toString())
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var player: ExoPlayer
              private lateinit var list: ListView
              private lateinit var header: TextView
              private lateinit var now: TextView
              private var items: List<StreamInfoItem> = emptyList()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val sp = getSharedPreferences("crash", MODE_PRIVATE)
                  Thread.setDefaultUncaughtExceptionHandler { _, e ->
                      sp.edit().putString("log", android.util.Log.getStackTraceString(e)).commit()
                      android.os.Process.killProcess(android.os.Process.myPid())
                  }
                  sp.getString("log", null)?.let {
                      sp.edit().remove("log").apply()
                      androidx.appcompat.app.AlertDialog.Builder(this)
                          .setTitle("Pichla crash").setMessage(it.take(1500))
                          .setPositiveButton("OK", null).show()
                  }
                  NewPipe.init(DL())
                  val ds = DefaultHttpDataSource.Factory().setUserAgent(UA)
                  player = ExoPlayer.Builder(this).setMediaSourceFactory(DefaultMediaSourceFactory(ds)).build()
                  player.addListener(object : Player.Listener {
                      override fun onPlayerError(error: PlaybackException) {
                          now.text = "Play error: ${error.errorCodeName}"
                      }
                  })

                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 48, 24, 24) }
                  val row = LinearLayout(this)
                  val input = EditText(this).apply {
                      hint = "Song search karo"; setSingleLine(); imeOptions = EditorInfo.IME_ACTION_SEARCH
                  }
                  val go = Button(this).apply { text = "Search" }
                  row.addView(input, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(go)
                  header = TextView(this).apply { textSize = 18f; setPadding(0, 16, 0, 8) }
                  list = ListView(this)
                  now = TextView(this).apply { text = "Kuch play nahi ho raha"; setPadding(0, 12, 0, 12) }
                  val pp = Button(this).apply { text = "Pause / Play" }
                  root.addView(row)
                  root.addView(header)
                  root.addView(list, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(now)
                  root.addView(pp)
                  setContentView(root)

                  list.setOnItemClickListener { _, _, pos, _ -> play(items[pos]) }
                  go.setOnClickListener {
                      val q = input.text.toString().trim()
                      if (q.isNotEmpty()) load("Results: $q") { search(q) }
                  }
                  input.setOnEditorActionListener { _, _, _ -> go.performClick(); true }
                  pp.setOnClickListener { if (player.isPlaying) player.pause() else player.play() }

                  load("Trending") { trending() }
              }

              private fun load(title: String, task: () -> List<StreamInfoItem>) {
                  header.text = "$title ..."
                  Thread {
                      try {
                          val r = task()
                          runOnUiThread {
                              items = r
                              header.text = title
                              list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1,
                                  r.map { "${it.name}\n${it.uploaderName ?: ""}" })
                          }
                      } catch (e: Throwable) {
                          runOnUiThread { header.text = "Error: ${e.stackTraceToString().take(1200)}" }
                      }
                  }.start()
              }

              private fun search(q: String): List<StreamInfoItem> {
                  val ex = ServiceList.YouTube.getSearchExtractor(q)
                  ex.fetchPage()
                  return ex.initialPage.items.filterIsInstance<StreamInfoItem>()
              }

              private fun trending(): List<StreamInfoItem> = search("trending music songs")

              private fun play(i: StreamInfoItem) {
                  now.text = "Loading: ${i.name}"
                  Thread {
                      try {
                          val info = StreamInfo.getInfo(ServiceList.YouTube, i.url)
                          val a = info.audioStreams
                              .filter { it.deliveryMethod == DeliveryMethod.PROGRESSIVE_HTTP }
                              .maxByOrNull { it.averageBitrate }
                              ?: throw Exception("Audio stream nahi mila")
                          runOnUiThread {
                              player.setMediaItem(MediaItem.fromUri(a.content))
                              player.prepare()
                              player.play()
                              now.text = "Playing: ${i.name}"
                          }
                      } catch (e: Throwable) {
                          runOnUiThread { now.text = "Error: ${e.stackTraceToString().take(1200)}" }
                      }
                  }.start()
              }

              override fun onDestroy() { player.release(); super.onDestroy() }
          }
          EOF

      - name: Build debug APK
        working-directory: ytapp
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: music-app-debug-apk
          path: ytapp/app/build/outputs/apk/debug/*.apk
