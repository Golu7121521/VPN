name: Build Reel Downloader APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Add Dependencies
        run: |
          flutter create downloader_app
          cd downloader_app
          flutter pub add dio video_player shared_preferences gal path_provider receive_sharing_intent

      - name: Generate Flutter UI & Logic Code (main.dart)
        run: |
          cd downloader_app
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:receive_sharing_intent/receive_sharing_intent.dart';
          import 'package:dio/dio.dart';
          import 'package:gal/gal.dart';
          import 'package:video_player/video_player.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:path_provider/path_provider.dart';

          void main() => runApp(const MediaDownloaderApp());

          class MediaDownloaderApp extends StatelessWidget {
            const MediaDownloaderApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Reel Downloader',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                  primaryColor: Colors.blueAccent,
                ),
                home: const DownloaderScreen(),
              );
            }
          }

          class DownloaderScreen extends StatefulWidget {
            const DownloaderScreen({super.key});
            @override
            State<DownloaderScreen> createState() => _DownloaderScreenState();
          }

          class _DownloaderScreenState extends State<DownloaderScreen> {
            final TextEditingController _urlController = TextEditingController();
            bool _isDownloading = false;
            String _statusText = "";
            VideoPlayerController? _videoController;
            StreamSubscription? _intentDataStreamSubscription;
            List<Map<String, String>> _history = [];

            @override
            void initState() {
              super.initState();
              _loadHistory();
              _setupIntentListener();
            }

            void _setupIntentListener() {
              // App background se aane par
              _intentDataStreamSubscription = ReceiveSharingIntent.getTextStream().listen((String value) {
                _handleSharedText(value);
              }, onError: (err) {});

              // App pehli baar open hone par
              ReceiveSharingIntent.getInitialText().then((String? value) {
                if (value != null) _handleSharedText(value);
              });
            }

            void _handleSharedText(String text) {
              if (text.contains("http")) {
                RegExp regExp = RegExp(r"(https?:\/\/[^\s]+)");
                final match = regExp.firstMatch(text);
                if (match != null) {
                  _urlController.text = match.group(0)!;
                  _startDownload();
                }
              }
            }

            Future<void> _loadHistory() async {
              final prefs = await SharedPreferences.getInstance();
              final historyJson = prefs.getString('download_history');
              if (historyJson != null) {
                setState(() {
                  _history = List<Map<String, String>>.from(json.decode(historyJson).map((x) => Map<String, String>.from(x)));
                });
              }
            }

            Future<void> _saveToHistory(String url, String localPath) async {
              final prefs = await SharedPreferences.getInstance();
              _history.insert(0, {
                "url": url,
                "date": DateTime.now().toString().substring(0, 16),
                "path": localPath,
              });
              await prefs.setString('download_history', json.encode(_history));
              setState(() {});
            }

            Future<void> _startDownload() async {
              final url = _urlController.text.trim();
              if (url.isEmpty) return;

              setState(() {
                _isDownloading = true;
                _statusText = "Server se connect kar rahe hain...";
                if (_videoController != null) {
                  _videoController!.dispose();
                  _videoController = null;
                }
              });

              try {
                // Request Permission
                await Gal.requestAccess();

                final tempDir = await getTemporaryDirectory();
                final savePath = "${tempDir.path}/Reel_${DateTime.now().millisecondsSinceEpoch}.mp4";

                // Server API call (Bina JSON ke direct file download)
                final apiUrl = "https://allinonedownloader-docker.onrender.com/download?url=${Uri.encodeComponent(url)}";
                
                final dio = Dio();
                await dio.download(
                  apiUrl,
                  savePath,
                  onReceiveProgress: (rec, total) {
                    if (total != -1) {
                      setState(() {
                        _statusText = "Downloading: ((rec / total) * 100).toStringAsFixed(0)%";
                      });
                    }
                  },
                );

                setState(() => _statusText = "Gallery mein save ho raha hai...");
                
                // Save to Gallery
                await Gal.putVideo(savePath);
                
                // Initialize Video Player for Preview
                _videoController = VideoPlayerController.file(File(savePath))
                  ..initialize().then((_) {
                    setState(() {});
                    _videoController!.setLooping(true);
                    _videoController!.play();
                  });

                await _saveToHistory(url, savePath);
                setState(() => _statusText = "Successfully Downloaded!");

              } catch (e) {
                setState(() => _statusText = "Error: Video private ho sakti hai ya invalid link.");
              } finally {
                setState(() => _isDownloading = false);
              }
            }

            void _deleteHistory(int index) async {
              _history.removeAt(index);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('download_history', json.encode(_history));
              setState(() {});
            }

            @override
            void dispose() {
              _intentDataStreamSubscription?.cancel();
              _videoController?.dispose();
              _urlController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('All Media Downloader', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.blueAccent)),
                  backgroundColor: const Color(0xFF0F172A),
                  elevation: 0,
                ),
                body: DefaultTabController(
                  length: 2,
                  child: Column(
                    children: [
                      const TabBar(
                        indicatorColor: Colors.blueAccent,
                        tabs: [Tab(icon: Icon(Icons.download), text: "Download"), Tab(icon: Icon(Icons.history), text: "History")],
                      ),
                      Expanded(
                        child: TabBarView(
                          children: [
                            // --- DOWNLOAD TAB ---
                            SingleChildScrollView(
                              padding: const EdgeInsets.all(16.0),
                              child: Column(
                                children: [
                                  // Video Preview (9:16 Ratio)
                                  Container(
                                    width: MediaQuery.of(context).size.width * 0.7,
                                    decoration: BoxDecoration(
                                      borderRadius: BorderRadius.circular(16),
                                      boxShadow: [BoxShadow(color: Colors.blueAccent.withOpacity(0.3), blurRadius: 20)],
                                    ),
                                    child: AspectRatio(
                                      aspectRatio: 9 / 16,
                                      child: ClipRRect(
                                        borderRadius: BorderRadius.circular(16),
                                        child: _videoController != null && _videoController!.value.isInitialized
                                            ? VideoPlayer(_videoController!)
                                            : Container(
                                                color: Colors.black87,
                                                child: const Center(
                                                  child: Icon(Icons.video_library, size: 60, color: Colors.white24),
                                                ),
                                              ),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(height: 24),
                                  TextField(
                                    controller: _urlController,
                                    decoration: InputDecoration(
                                      hintText: 'Paste Reel/Post link here...',
                                      filled: true,
                                      fillColor: const Color(0xFF1E293B),
                                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                                      prefixIcon: const Icon(Icons.link, color: Colors.blueAccent),
                                    ),
                                  ),
                                  const SizedBox(height: 16),
                                  SizedBox(
                                    width: double.infinity,
                                    height: 55,
                                    child: ElevatedButton.icon(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: Colors.blueAccent,
                                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                      ),
                                      onPressed: _isDownloading ? null : _startDownload,
                                      icon: _isDownloading
                                          ? const SizedBox(width: 24, height: 24, child: CircularProgressIndicator(color: Colors.white, strokeWidth: 2))
                                          : const Icon(Icons.download, color: Colors.white),
                                      label: Text(_isDownloading ? 'Processing...' : 'Download Reel', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                                    ),
                                  ),
                                  const SizedBox(height: 12),
                                  Text(_statusText, style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                                ],
                              ),
                            ),
                            // --- HISTORY TAB ---
                            ListView.builder(
                              itemCount: _history.length,
                              padding: const EdgeInsets.all(12),
                              itemBuilder: (context, index) {
                                final item = _history[index];
                                return Card(
                                  color: const Color(0xFF1E293B),
                                  margin: const EdgeInsets.only(bottom: 12),
                                  child: ListTile(
                                    leading: Container(
                                      width: 40, height: 40,
                                      decoration: BoxDecoration(color: Colors.blueAccent.withOpacity(0.2), borderRadius: BorderRadius.circular(8)),
                                      child: const Icon(Icons.check_circle, color: Colors.blueAccent),
                                    ),
                                    title: Text("Downloaded on ${item['date']}", style: const TextStyle(fontSize: 13, color: Colors.white)),
                                    subtitle: Text(item['url'] ?? '', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white54)),
                                    trailing: IconButton(
                                      icon: const Icon(Icons.delete, color: Colors.redAccent),
                                      onPressed: () => _deleteHistory(index),
                                    ),
                                  ),
                                );
                              },
                            )
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Update Android Manifest for Share Intent & Permissions
        run: |
          cd downloader_app
          # Add Permissions
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          
          # Add Intent Filter for sharing
          sed -i '/<\/activity>/i \
                      <intent-filter>\
                          <action android:name="android.intent.action.SEND" />\
                          <category android:name="android.intent.category.DEFAULT" />\
                          <data android:mimeType="text/plain" />\
                      </intent-filter>' android/app/src/main/AndroidManifest.xml
                      
          # Update minSDK for plugins
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle

      - name: Build Android APK
        run: |
          cd downloader_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelDownloader-App-APK
          path: downloader_app/build/app/outputs/flutter-apk/app-release.apk
