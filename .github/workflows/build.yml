name: Build Musify APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android folder repo mein stored nahi hai.
      # GitHub Actions mein fresh Android project generate hoga.
      - name: Generate Android platform files
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name musify \
            .

          rm -f test/widget_test.dart

      # Android Manifest + Audio Service + AdMob App ID
      - name: Patch Android
        run: |
          python3 - <<'PY'
          import re
          import glob
          import os
          import shutil

          manifest = 'android/app/src/main/AndroidManifest.xml'

          with open(manifest, 'r') as f:
              s = f.read()

          # ---------------------------------------------------------
          # 1. Add tools namespace
          # ---------------------------------------------------------
          if 'xmlns:tools=' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<manifest '
                  'xmlns:android="http://schemas.android.com/apk/res/android" '
                  'xmlns:tools="http://schemas.android.com/tools"',
                  1
              )

          # ---------------------------------------------------------
          # 2. Android permissions
          # ---------------------------------------------------------
          permissions = [
              'INTERNET',
              'WAKE_LOCK',
              'FOREGROUND_SERVICE',
              'FOREGROUND_SERVICE_MEDIA_PLAYBACK',
          ]

          permission_block = ''.join(
              f'    <uses-permission android:name="android.permission.{permission}"/>\n'
              for permission in permissions
          )

          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<application',
                  permission_block + '    <application',
                  1
              )

          # ---------------------------------------------------------
          # 3. Allow cleartext traffic
          # ---------------------------------------------------------
          s = s.replace(
              '<application',
              '<application android:usesCleartextTraffic="true"',
              1
          )

          # ---------------------------------------------------------
          # 4. AdMob APPLICATION ID
          #
          # Your AdMob App ID:
          # ca-app-pub-1021473146993515~3074588539
          # ---------------------------------------------------------
          admob_app_id = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-1021473146993515~3074588539"/>
          '''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace(
                  '</application>',
                  admob_app_id + '    </application>',
                  1
              )

          # ---------------------------------------------------------
          # 5. Audio service
          # ---------------------------------------------------------
          audio_service = '''
              <service
                  android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true"
                  tools:ignore="Instantiatable">

                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService"/>
                  </intent-filter>

              </service>

              <receiver
                  android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true"
                  tools:ignore="Instantiatable">

                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON"/>
                  </intent-filter>

              </receiver>
          '''

          if 'com.ryanheise.audioservice.AudioService' not in s:
              s = s.replace(
                  '</application>',
                  audio_service + '    </application>',
                  1
              )

          # ---------------------------------------------------------
          # 6. App label
          # ---------------------------------------------------------
          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="Musify"',
              s,
              count=1
          )

          # Save Manifest
          with open(manifest, 'w') as f:
              f.write(s)

          # ---------------------------------------------------------
          # 7. Remove generated MainActivity
          # ---------------------------------------------------------
          for f in glob.glob(
              'android/app/src/main/**/MainActivity.*',
              recursive=True
          ):
              os.remove(f)

          # ---------------------------------------------------------
          # 8. Create required package directories
          # ---------------------------------------------------------
          kotlin_dir = 'android/app/src/main/kotlin/com/example/musify'
          java_dir = 'android/app/src/main/java/com/example/musify'

          os.makedirs(kotlin_dir, exist_ok=True)
          os.makedirs(java_dir, exist_ok=True)

          # ---------------------------------------------------------
          # 9. Copy custom Android files
          # ---------------------------------------------------------
          shutil.copy(
              'android_extra/MainActivity.kt',
              kotlin_dir + '/MainActivity.kt'
          )

          shutil.copy(
              'android_extra/UrlCompat.java',
              java_dir + '/UrlCompat.java'
          )

          shutil.copy(
              'android_extra/patch_npe.gradle',
              'android/app/patch_npe.gradle'
          )

          shutil.copy(
              'android_extra/proguard-extra.pro',
              'android/app/proguard-extra.pro'
          )

          # ---------------------------------------------------------
          # 10. Apply NPE patch
          # ---------------------------------------------------------
          with open('android/app/build.gradle.kts', 'a') as g:
              g.write('\napply(from = "patch_npe.gradle")\n')

          print("Android patch completed successfully.")
          print("AdMob App ID added successfully.")

          PY

      # -----------------------------------------------------------
      # Flutter dependencies
      # -----------------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # -----------------------------------------------------------
      # Build APK
      # -----------------------------------------------------------
      - name: Build APK
        run: flutter build apk --profile

      # -----------------------------------------------------------
      # Upload APK
      # -----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musify-apk
          path: build/app/outputs/flutter-apk/app-profile.apk