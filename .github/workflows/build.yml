name: Build Roxyfy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com --project-name roxyfy .
          rm -f test/widget_test.dart

      - name: Patch Android (permissions, audio service, NewPipe, Duplicate Classes Fix, CompileSdk)
        run: |
          python3 - <<'PY'
          import re, glob, os, shutil
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"', 1)
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x
                          for x in ['INTERNET', 'WAKE_LOCK', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK'])
          s = s.replace('<application', perms + '    <application android:usesCleartextTraffic="true" android:allowBackup="false"', 1)
          svc = '''    <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable">
              <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
            </service>
            <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">
              <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
            </receiver>
            <!-- Start.io APP ID Config (Change YOUR_STARTIO_APP_ID to your real ID for production) -->
            <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="209754772"/>
          '''
          s = s.replace('</application>', svc + '  </application>', 1)
          share = '''      <intent-filter>
              <action android:name="android.intent.action.SEND"/>
              <category android:name="android.intent.category.DEFAULT"/>
              <data android:mimeType="text/plain"/>
            </intent-filter>
          '''
          s = s.replace('</activity>', share + '    </activity>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Roxyfy"', s, 1)
          open(p, 'w').write(s)
          
          # --- UPDATE APP-LEVEL COMPILE SDK TO 36 ---
          g_path = 'android/app/build.gradle.kts'
          if os.path.exists(g_path):
              g_text = open(g_path).read()
              g_text = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', g_text)
              open(g_path, 'w').write(g_text)
          # ------------------------------------------
          
          for f in glob.glob('android/app/src/main/**/MainActivity.*', recursive=True):
              os.remove(f)
          kd = 'android/app/src/main/kotlin/com/roxyfy'
          jd = 'android/app/src/main/java/com/roxyfy'
          os.makedirs(kd, exist_ok=True)
          os.makedirs(jd, exist_ok=True)
          shutil.copy('android_extra/MainActivity.kt', kd + '/MainActivity.kt')
          shutil.copy('android_extra/UrlCompat.java', jd + '/UrlCompat.java')
          shutil.copy('android_extra/patch_npe.gradle', 'android/app/patch_npe.gradle')
          shutil.copy('android_extra/proguard-extra.pro', 'android/app/proguard-extra.pro')
          shutil.rmtree('android/app/src/main/res/mipmap-anydpi-v26', ignore_errors=True)
          shutil.copytree('android_extra/res', 'android/app/src/main/res', dirs_exist_ok=True)
          with open('android/app/build.gradle.kts', 'a') as g:
              g.write('\napply(from = "patch_npe.gradle")\n')
              g.write('configurations.all { exclude(group = "com.google.code.findbugs", module = "jsr305") }\n')
          PY

      - run: flutter pub get

      # --- YAHAN NAYA STEP ADD HUA HAI ---
      - name: Force Plugins to CompileSdk 36
        run: |
          find ~/.pub-cache/hosted -path "*/android/build.gradle" -exec sed -i 's/compileSdkVersion [0-9][0-9]/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted -path "*/android/build.gradle" -exec sed -i 's/compileSdk [0-9][0-9]/compileSdk 36/g' {} +
          find ~/.pub-cache/hosted -path "*/android/build.gradle.kts" -exec sed -i 's/compileSdk = [0-9][0-9]/compileSdk = 36/g' {} +
          find ~/.pub-cache/hosted -path "*/android/build.gradle.kts" -exec sed -i 's/compileSdkVersion([0-9][0-9])/compileSdkVersion(36)/g' {} +
      # -----------------------------------

      - name: Prepare signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/roxy.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/roxy.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KS_KEYPASS"
            } >> "$GITHUB_ENV"
            SIG=$(keytool -list -v -keystore "$RUNNER_TEMP/roxy.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
            echo "EXPECTED_SIG=$SIG" >> "$GITHUB_ENV"
            echo "Signing with your own key."
          else
            echo "No keystore secrets: using the debug key (updates may need an uninstall)."
          fi

      - name: Build APKs
        run: |
          COMMON="--split-per-abi --target-platform android-arm,android-arm64 --dart-define=EXPECTED_SIG=${EXPECTED_SIG:-}"
          if ! flutter build apk --release $COMMON --obfuscate --split-debug-info=build/symbols; then
            echo "::warning::Release build failed, building a profile APK instead."
            flutter build apk --profile $COMMON
          fi
          ls -la build/app/outputs/flutter-apk

      - uses: actions/upload-artifact@v4
        with:
          name: roxyfy-apk
          path: build/app/outputs/flutter-apk/*.apk
