name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/vidsniff

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VidSniff"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.vidsniff'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.vidsniff'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="VidSniff"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/vidsniff/MainActivity.java <<'EOF'
          package com.example.vidsniff;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import java.util.LinkedHashSet;

          public class MainActivity extends Activity {
              WebView web;
              EditText urlBox;
              Button listBtn;
              final LinkedHashSet<String> found = new LinkedHashSet<>();
              final Handler handler = new Handler();

              static final String JS = "(function(){var r=[];document.querySelectorAll('video,source').forEach(function(e){var s=e.currentSrc||e.src;if(s&&s.indexOf('http')==0)r.push(s)});return r.join('|');})()";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout bar = new LinearLayout(this);
                  urlBox = new EditText(this);
                  urlBox.setSingleLine(true);
                  urlBox.setHint("URL ya search likho");
                  urlBox.setImeOptions(EditorInfo.IME_ACTION_GO);
                  Button go = new Button(this);
                  go.setText("Go");
                  bar.addView(urlBox, new LinearLayout.LayoutParams(0, -2, 1f));
                  bar.addView(go);
                  web = new WebView(this);
                  listBtn = new Button(this);
                  listBtn.setText("Videos (0)");
                  root.addView(bar, new LinearLayout.LayoutParams(-1, -2));
                  root.addView(web, new LinearLayout.LayoutParams(-1, 0, 1f));
                  root.addView(listBtn, new LinearLayout.LayoutParams(-1, -2));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          check(r.getUrl().toString(), false);
                          return null;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return false;
                      }
                      @Override
                      public void onPageStarted(WebView v, String url, android.graphics.Bitmap f) {
                          found.clear();
                          listBtn.setText("Videos (0)");
                          urlBox.setText(url);
                      }
                  });

                  go.setOnClickListener(v -> load());
                  urlBox.setOnEditorActionListener((v, a, e) -> { load(); return true; });
                  listBtn.setOnClickListener(v -> showList());

                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          web.evaluateJavascript(JS, val -> {
                              if (val == null) return;
                              val = val.replace("\"", "").replace("\\/", "/");
                              for (String u : val.split("\\|")) {
                                  if (u.startsWith("http")) add(u);
                              }
                          });
                          handler.postDelayed(this, 3000);
                      }
                  });

                  web.loadUrl("https://www.google.com");
              }

              void load() {
                  String t = urlBox.getText().toString().trim();
                  if (t.isEmpty()) return;
                  if (t.startsWith("http")) web.loadUrl(t);
                  else if (t.contains(".") && !t.contains(" ")) web.loadUrl("https://" + t);
                  else web.loadUrl("https://www.google.com/search?q=" + android.net.Uri.encode(t));
              }

              void check(String url, boolean force) {
                  String p = url.toLowerCase().split("\\?")[0];
                  boolean ok = p.endsWith(".mp4") || p.endsWith(".m3u8") || p.endsWith(".webm")
                          || p.endsWith(".mkv") || p.endsWith(".mpd") || p.endsWith(".m4v")
                          || p.endsWith(".flv") || p.endsWith(".mov") || p.endsWith(".3gp");
                  if (ok || force) add(url);
              }

              void add(String url) {
                  runOnUiThread(() -> {
                      if (found.add(url)) listBtn.setText("Videos (" + found.size() + ")");
                  });
              }

              void showList() {
                  if (found.isEmpty()) {
                      Toast.makeText(this, "Abhi koi video link nahi mila. Video play karo.", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  final String[] items = found.toArray(new String[0]);
                  new AlertDialog.Builder(this)
                          .setTitle("Tap karke link copy karo")
                          .setItems(items, (d, i) -> {
                              ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                              cm.setPrimaryClip(ClipData.newPlainText("video", items[i]));
                              Toast.makeText(this, "Link copy ho gaya", Toast.LENGTH_SHORT).show();
                          })
                          .setPositiveButton("Close", null)
                          .show();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VidSniff-apk
          path: app/build/outputs/apk/debug/app-debug.apk
