        cat << 'EOF' > app/src/main/res/drawable/bg_floating_bubble.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#00E5FF" />
            <stroke android:width="2dp" android:color="#FFFFFF" />
        </shape>
        EOF

        # 10. Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="@string/app_name"
                android:theme="@style/Theme.FastGameVPN">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Core VPNGate Service -->
                <service
                    android:name=".GameVpnService"
                    android:permission="android.permission.BIND_VPN_SERVICE"
                    android:exported="false"
                    android:foregroundServiceType="specialUse">
                    <property
                        android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                        android:value="Game Tunnel Core" />
                    <intent-filter>
                        <action android:name="android.net.VpnService" />
                    </intent-filter>
                </service>

                <!-- Floating Overlay Service -->
                <service
                    android:name=".FloatingBubbleService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse">
                    <property
                        android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
