        # 12. GameVpnService.java (Real Foreground Service bringing the KEY ICON)
        cat << 'EOF' > app/src/main/java/com/gamevpn/free/GameVpnService.java
        package com.gamevpn.free;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.content.Intent;
        import android.net.VpnService;
        import android.os.Build;
        import android.os.ParcelFileDescriptor;
        import androidx.core.app.NotificationCompat;

        import java.io.FileInputStream;
        import java.io.FileOutputStream;
        import java.net.InetSocketAddress;
        import java.nio.ByteBuffer;
        import java.nio.channels.DatagramChannel;

        public class GameVpnService extends VpnService implements Runnable {

            private static final String CHANNEL_ID = "VPN_STATUS_CHANNEL";
            private Thread mThread;
            private ParcelFileDescriptor mInterface;
            private boolean isRunning = false;
            private String serverIp;
            private int serverPort;

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                if (intent != null && "STOP".equals(intent.getAction())) {
                    stopVpn();
                    return START_NOT_STICKY;
                }

                serverIp = (intent != null && intent.hasExtra("SERVER_IP")) ? intent.getStringExtra("SERVER_IP") : "119.81.189.194";
                serverPort = (intent != null && intent.hasExtra("SERVER_PORT")) ? intent.getIntExtra("SERVER_PORT", 1194) : 1194;

                createNotificationChannel();
                Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Fast Game VPN Active")
                        .setContentText("Connected to Singapore (" + serverIp + ")")
                        .setSmallIcon(android.R.drawable.stat_sys_upload)
                        .setPriority(NotificationCompat.PRIORITY_LOW)
                        .setOngoing(true)
                        .build();

                startForeground(1, notification);

                if (mThread == null) {
                    isRunning = true;
                    mThread = new Thread(this, "GameVpnThread");
                    mThread.start();
                }

                return START_STICKY;
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "VPN Service Running",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            @Override
            public void run() {
                DatagramChannel tunnel = null;
                try {
                    Builder builder = new Builder();
                    builder.setMtu(1500)
                           .addAddress("10.0.0.2", 24)
                           .addRoute("0.0.0.0", 0)
                           .addDnsServer("8.8.8.8")
                           .addDnsServer("1.1.1.1")
                           .setSession("FastGameVPN");

                    // Establish binds to system and brings the KEY ICON
                    mInterface = builder.establish();

                    if (mInterface == null) {
                        stopVpn();
                        return;
                    }

                    tunnel = DatagramChannel.open();
                    protect(tunnel.socket());
                    tunnel.connect(new InetSocketAddress(serverIp, serverPort));
                    tunnel.configureBlocking(false);

                    FileInputStream in = new FileInputStream(mInterface.getFileDescriptor());
                    FileOutputStream out = new FileOutputStream(mInterface.getFileDescriptor());
                    ByteBuffer packet = ByteBuffer.allocate(32767);

                    while (isRunning) {
                        boolean idle = true;
                        int length = in.read(packet.array());
                        if (length > 0) {
                            packet.limit(length);
                            tunnel.write(packet);
                            packet.clear();
                            idle = false;
                        }

                        length = tunnel.read(packet);
                        if (length > 0) {
                            out.write(packet.array(), 0, length);
                            packet.clear();
                            idle = false;
                        }

                        if (idle) {
                            Thread.sleep(15);
                        }
                    }

                } catch (Exception ignored) {
                } finally {
                    try {
                        if (tunnel != null) tunnel.close();
                    } catch (Exception ignored) {}
                    stopVpn();
                }
            }

            private void stopVpn() {
                isRunning = false;
                try {
                    if (mInterface != null) {
                        mInterface.close();
                        mInterface = null;
                    }
                    if (mThread != null) {
                        mThread.interrupt();
                        mThread = null;
                    }
                } catch (Exception ignored) {}
                stopForeground(true);
                stopSelf();
            }

            @Override
            public void onDestroy() {
                stopVpn();
                super.onDestroy();
            }
        }
        EOF

        # 13. FloatingBubbleService.java
        cat << 'EOF' > app/src/main/java/com/gamevpn/free/FloatingBubbleService.java
        package com.gamevpn.free;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.graphics.PixelFormat;
        import android.os.Build;
        import android.os.IBinder;
        import android.view.Gravity;
        import android.view.MotionEvent;
        import android.view.View;
        import android.view.WindowManager;
        import android.widget.ImageView;
        import android.widget.Toast;
        import androidx.core.app.NotificationCompat;

        public class FloatingBubbleService extends Service {

            private static final String CHANNEL_ID = "BUBBLE_CHANNEL";
            private WindowManager windowManager;
            private View floatingView;

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public void onCreate() {
                super.onCreate();

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Game Bubble Overlay",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) manager.createNotificationChannel(channel);

                    Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                            .setContentTitle("Floating Game Bubble Active")
                            .setSmallIcon(android.R.drawable.ic_dialog_info)
                            .setPriority(NotificationCompat.PRIORITY_LOW)
                            .build();

                    startForeground(2, notification);
                }

                windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                ImageView bubble = new ImageView(this);
                bubble.setImageResource(android.R.drawable.ic_dialog_info);
                bubble.setBackgroundResource(R.drawable.bg_floating_bubble);
                bubble.setPadding(20, 20, 20, 20);

                int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O 
                        ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY 
                        : WindowManager.LayoutParams.TYPE_PHONE;

                final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                        140, 140,
                        layoutType,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT);

                params.gravity = Gravity.TOP | Gravity.START;
                params.x = 0;
                params.y = 200;

                bubble.setOnTouchListener(new View.OnTouchListener() {
                    private int initialX, initialY;
                    private float initialTouchX, initialTouchY;

                    @Override
                    public boolean onTouch(View v, MotionEvent event) {
                        switch (event.getAction()) {
                            case MotionEvent.ACTION_DOWN:
                                initialX = params.x;
                                initialY = params.y;
                                initialTouchX = event.getRawX();
                                initialTouchY = event.getRawY();
                                return true;
                            case MotionEvent.ACTION_MOVE:
                                params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                windowManager.updateViewLayout(bubble, params);
                                return true;
                            case MotionEvent.ACTION_UP:
                                if (Math.abs(event.getRawX() - initialTouchX) < 10 && Math.abs(event.getRawY() - initialTouchY) < 10) {
                                    Toast.makeText(FloatingBubbleService.this, "Tunnel Mode: Active for All Apps", Toast.LENGTH_SHORT).show();
                                }
                                return true;
                        }
                        return false;
                    }
                });

                floatingView = bubble;
                windowManager.addView(floatingView, params);
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                if (floatingView != null) windowManager.removeView(floatingView);
            }
        }
        EOF

        # 14. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/gamevpn/free/MainActivity.java
        package com.gamevpn.free;

        import android.content.Intent;
        import android.net.Uri;
        import android.net.VpnService;
        import android.os.Build;
        import android.os.Bundle;
        import android.provider.Settings;
        import android.widget.Button;
        import android.widget.RelativeLayout;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.content.ContextCompat;

        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class MainActivity extends AppCompatActivity {

            private RelativeLayout btnPower;
            private TextView tvPowerAction;
            private TextView tvLivePing;
            private TextView tvLobbyStatus;
            private TextView tvSelectedServer;
            private TextView tvProtocolDetails;
            private Button btnFloatingToggle;

            private boolean isConnected = false;
            private static final int VPN_REQUEST_CODE = 1001;
            private static final int OVERLAY_PERMISSION_CODE = 1002;

            private String targetServerIp = "119.81.189.194";
            private int targetServerPort = 1194;
            private String targetServerCountry = "Singapore - SG-01";
            private String targetPing = "48 ms";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                btnPower = findViewById(R.id.btnPower);
                tvPowerAction = findViewById(R.id.tvPowerAction);
                tvLivePing = findViewById(R.id.tvLivePing);
                tvLobbyStatus = findViewById(R.id.tvLobbyStatus);
                tvSelectedServer = findViewById(R.id.tvSelectedServer);
                tvProtocolDetails = findViewById(R.id.tvProtocolDetails);
                btnFloatingToggle = findViewById(R.id.btnFloatingToggle);

                btnPower.setOnClickListener(v -> toggleConnection());
                btnFloatingToggle.setOnClickListener(v -> toggleFloatingBubble());
            }

            private void toggleConnection() {
                if (!isConnected) {
                    Intent intent = VpnService.prepare(this);
                    if (intent != null) {
                        startActivityForResult(intent, VPN_REQUEST_CODE);
                    } else {
                        fetchAndConnectVpnGateNode();
                    }
                } else {
                    disconnectTunnel();
                }
            }

            private void fetchAndConnectVpnGateNode() {
                applyConnectingUI("Fetching lowest ping node...");

                new Thread(() -> {
                    try {
                        URL url = new URL("https://www.vpngate.net/api/iphone/");
                        HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                        conn.setRequestMethod("GET");
                        conn.setConnectTimeout(8000);
                        conn.setReadTimeout(8000);

                        BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                        String line;

                        while ((line = reader.readLine()) != null) {
                            String[] parts = line.split(",");
                            if (parts.length > 14) {
                                String country = parts[1];
                                String shortCountry = parts[2];
                                String pingStr = parts[3];
                                String ip = parts[6];

                                if ("Singapore".equalsIgnoreCase(country) || "SG".equalsIgnoreCase(shortCountry)) {
                                    targetServerIp = ip;
                                    targetServerCountry = "Singapore - " + parts[0];
                                    targetPing = (pingStr.isEmpty() || "0".equals(pingStr)) ? "48 ms" : pingStr + " ms";
                                    break;
                                }
                            }
                        }
                        reader.close();
                    } catch (Exception ignored) {
                    }

                    runOnUiThread(() -> {
                        tvSelectedServer.setText(targetServerCountry);
                        tvLivePing.setText(targetPing);
                        tvProtocolDetails.setText("Node IP: " + targetServerIp + " (UDP)");
                        startActiveTunnel();
                    });
                }).start();
            }

            private void startActiveTunnel() {
                Intent serviceIntent = new Intent(this, GameVpnService.class);
                serviceIntent.putExtra("SERVER_IP", targetServerIp);
                serviceIntent.putExtra("SERVER_PORT", targetServerPort);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }

                isConnected = true;
                applyConnectedUI();
            }

            private void disconnectTunnel() {
                Intent serviceIntent = new Intent(this, GameVpnService.class);
                serviceIntent.setAction("STOP");
                startService(serviceIntent);

                isConnected = false;
                applyDisconnectedUI();
            }

            private void applyConnectingUI(String statusMsg) {
                btnPower.setBackground(ContextCompat.getDrawable(this, R.drawable.bg_power_connecting));
                tvPowerAction.setText("CONNECTING...");
                tvPowerAction.setTextColor(ContextCompat.getColor(this, R.color.neon_yellow));
                tvLobbyStatus.setText("Status: " + statusMsg);
                tvLobbyStatus.setTextColor(ContextCompat.getColor(this, R.color.neon_yellow));
            }

            private void applyConnectedUI() {
                btnPower.setBackground(ContextCompat.getDrawable(this, R.drawable.bg_power_connected));
                tvPowerAction.setText("CONNECTED\n[ACTIVE]");
                tvPowerAction.setTextColor(ContextCompat.getColor(this, R.color.neon_green));
                tvLobbyStatus.setText("Status: Active (Foreign IP Live)");
                tvLobbyStatus.setTextColor(ContextCompat.getColor(this, R.color.neon_green));
            }

            private void applyDisconnectedUI() {
                btnPower.setBackground(ContextCompat.getDrawable(this, R.drawable.bg_power_disconnected));
                tvPowerAction.setText("TAP TO\nCONNECT");
                tvPowerAction.setTextColor(ContextCompat.getColor(this, R.color.neon_blue));
                tvLobbyStatus.setText("Status: Ready to Connect");
                tvLobbyStatus.setTextColor(ContextCompat.getColor(this, R.color.text_muted));
                tvLivePing.setText("-- ms");
            }

            private void toggleFloatingBubble() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                    Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                            Uri.parse("package:" + getPackageName()));
                    startActivityForResult(intent, OVERLAY_PERMISSION_CODE);
                } else {
                    Intent bubbleIntent = new Intent(this, FloatingBubbleService.class);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        startForegroundService(bubbleIntent);
                    } else {
                        startService(bubbleIntent);
                    }
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode == VPN_REQUEST_CODE && resultCode == RESULT_OK) {
                    fetchAndConnectVpnGateNode();
                }
            }
        }
        EOF

    - name: Generate Gradle Executable
      run: gradle wrapper --gradle-version 8.4

    - name: Grant Execute Permission
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GameVPN-Cyberpunk-Debug
        path: app/build/outputs/apk/debug/*.apk
