name: Generate Project and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Scaffold Android Project
      run: |
        mkdir -p app/src/main/java/com/gamevpn/free
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. gradle.properties (Full build optimization & AndroidX fix)
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GameVPN"
        include ':app'
        EOF

        # 3. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 4. app/build.gradle (Lint & compile flags fixed)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.gamevpn.free'
            compileSdk 34

            defaultConfig {
                applicationId "com.gamevpn.free"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.wireguard.android:tunnel:1.0.20230706'
        }
        EOF

        # 5. colors.xml (AAPT2 fix)
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="colorPrimary">#1E88E5</color>
            <color name="colorPrimaryDark">#0D47A1</color>
            <color name="colorAccent">#00FF66</color>
            <color name="backgroundDark">#121212</color>
        </resources>
        EOF

        # 6. strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Fast Game VPN</string>
        </resources>
        EOF

        # 7. themes.xml (Material style crash fix)
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.FastGameVPN" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">@color/colorPrimary</item>
                <item name="colorPrimaryVariant">@color/colorPrimaryDark</item>
                <item name="colorOnPrimary">#FFFFFF</item>
                <item name="android:statusBarColor">@color/backgroundDark</item>
            </style>
        </resources>
        EOF

        # 8. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="@string/app_name"
                android:theme="@style/Theme.FastGameVPN">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name="com.wireguard.android.backend.GoBackend$VpnService"
                    android:permission="android.permission.BIND_VPN_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.net.VpnService" />
                    </intent-filter>
                </service>
            </application>
        </manifest>
        EOF

        # 9. UI Layout (activity_main.xml)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="24dp"
            android:background="@color/backgroundDark">

            <TextView
                android:id="@+id/tvStatus"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Status: Ready"
                android:textColor="#FFFFFF"
                android:textSize="18sp"
                android:layout_marginBottom="12dp" />

            <TextView
                android:id="@+id/tvPing"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Engine: WireGuard UDP (Ultra Low Ping)"
                android:textColor="@color/colorAccent"
                android:textSize="14sp"
                android:layout_marginBottom="32dp" />

            <Button
                android:id="@+id/btnAction"
                android:layout_width="240dp"
                android:layout_height="60dp"
                android:text="Connect Game Mode"
                android:textSize="16sp"
                android:textColor="#FFFFFF"
                android:backgroundTint="@color/colorPrimary" />
        </LinearLayout>
        EOF

        # 10. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/gamevpn/free/MainActivity.java
        package com.gamevpn.free;

        import android.content.Intent;
        import android.net.VpnService;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {

            private TextView tvStatus;
            private Button btnAction;
            private static final int VPN_REQUEST_CODE = 1001;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                tvStatus = findViewById(R.id.tvStatus);
                btnAction = findViewById(R.id.btnAction);

                btnAction.setOnClickListener(v -> startVpnIntent());
            }

            private void startVpnIntent() {
                Intent intent = VpnService.prepare(this);
                if (intent != null) {
                    startActivityForResult(intent, VPN_REQUEST_CODE);
                } else {
                    tvStatus.setText("WireGuard Active: Ultra Low Ping");
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode == VPN_REQUEST_CODE && resultCode == RESULT_OK) {
                    tvStatus.setText("WireGuard Active: Ultra Low Ping");
                }
            }
        }
        EOF

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4

    - name: Grant Execute Permission
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GameVPN-WireGuard-Debug
        path: app/build/outputs/apk/debug/*.apk
