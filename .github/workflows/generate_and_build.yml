name: Generate Project and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Scaffold Real Working VPN with Key Icon
      run: |
        mkdir -p app/src/main/java/com/gamevpn/free
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p gradle/wrapper

        # 1. Wrapper Config
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # 2. Properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 3. Settings
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GameVPN"
        include ':app'
        EOF

        # 4. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 5. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.gamevpn.free'
            compileSdk 34

            defaultConfig {
                applicationId "com.gamevpn.free"
                minSdk 24
                targetSdk 34
                versionCode 5
                versionName "5.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.cardview:cardview:1.0.0'
        }
        EOF

        # 6. Colors
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="bg_main">#0B0E14</color>
            <color name="card_bg">#161B26</color>
            <color name="neon_blue">#00E5FF</color>
            <color name="neon_green">#00FF66</color>
            <color name="neon_yellow">#FFD600</color>
            <color name="neon_red">#FF1744</color>
            <color name="text_muted">#7A889B</color>
            <color name="text_white">#F0F4F8</color>
            <color name="divider_line">#222C3D</color>
        </resources>
        EOF

        # 7. Strings
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Fast Game VPN</string>
        </resources>
        EOF

        # 8. Themes
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.FastGameVPN" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="android:statusBarColor">@color/bg_main</item>
                <item name="android:navigationBarColor">@color/bg_main</item>
            </style>
        </resources>
        EOF

        # 9. Drawables
        cat << 'EOF' > app/src/main/res/drawable/bg_power_disconnected.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#1A2130" />
            <stroke android:width="4dp" android:color="@color/neon_blue" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_power_connecting.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#332B00" />
            <stroke android:width="4dp" android:color="@color/neon_yellow" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_power_connected.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#003820" />
            <stroke android:width="4dp" android:color="@color/neon_green" />
